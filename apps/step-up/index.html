<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a84ff" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0a84ff"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Step Up" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Dance studio ops — batches, plans, attendance, booking"
    />
    <link rel="icon" href="/icons/unicorn.png" type="image/png" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/icons/unicorn.png" as="image" type="image/png" />
    <link rel="preload" href="/loader.gif" as="image" type="image/gif" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Step Up</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dev-ui-theme-mode");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme-mode", mode);
          var theme = localStorage.getItem("dev-ui-theme");
          if (theme) {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("/fonts/plus-jakarta-sans-latin-500.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5efe6;
      }

      html[data-theme-mode="light"] {
        color-scheme: light;
      }

      html[data-theme-mode="dark"] {
        color-scheme: dark;
        background: oklch(0.13 0.005 78);
      }

      html[data-theme-mode="dark"] body {
        background: oklch(0.13 0.005 78);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #f5efe6;
        color: #1b2a4a;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }

      html[data-theme-mode="dark"] #boot-splash {
        background: oklch(0.13 0.005 78);
        color: oklch(0.95 0.01 78);
      }

      #boot-splash .dancer {
        display: block;
        width: min(100vw, 92dvh);
        height: min(72dvh, 100vw);
        max-width: 100%;
        max-height: 100%;
        margin: 0 auto;
        object-fit: contain;
        object-position: center;
        pointer-events: none;
        transform: translateY(-10%) scale(1.2);
      }

      #boot-splash .caption {
        position: absolute;
        top: 75%;
        left: 0;
        right: 0;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 0 1.5rem;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(1.25rem, 4.5vw, 1.75rem);
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.03em;
        color: #1c1a17;
        text-align: center;
        transform: translateY(-50%);
      }

      html[data-theme-mode="dark"] #boot-splash .caption {
        color: oklch(0.95 0.01 78);
      }

      #boot-splash .cascade {
        position: relative;
        display: block;
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        line-height: 1.3;
      }

      #boot-splash .measure {
        display: block;
        visibility: hidden;
        white-space: nowrap;
      }

      #boot-splash .cascade-layer {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        justify-content: center;
        width: 100%;
        height: 100%;
        white-space: pre;
      }

      #boot-splash .letter {
        display: inline-block;
        white-space: pre;
      }

      #boot-splash .letter.brand {
        color: #ee8a55;
      }

      #boot-splash .letter.space {
        width: 0.28em;
        flex-shrink: 0;
      }

      #boot-splash .cascade-layer[data-state="enter"] .letter {
        animation: boot-letter-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #boot-splash .cascade-layer[data-state="exit"] .letter {
        animation: boot-letter-out 0.18s ease both;
      }

      @keyframes boot-letter-in {
        from {
          opacity: 0;
          transform: translateY(105%);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes boot-letter-out {
        from {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        to {
          opacity: 0;
          transform: translateY(-105%);
          filter: blur(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .dancer {
          display: none;
        }

        #boot-splash .cascade-layer[data-state="enter"] .letter,
        #boot-splash .cascade-layer[data-state="exit"] .letter {
          animation: none;
        }
      }

      #boot-splash[data-slow-load] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 2rem 1rem;
        background: #f6f8fa;
        color: #24292f;
        text-align: center;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] {
        background: oklch(0.16 0.004 78);
        color: oklch(0.93 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        width: 100%;
        max-width: 28rem;
      }

      #boot-splash[data-slow-load] .slow-mascot {
        display: block;
        width: 10rem;
        height: 10rem;
        margin-bottom: 0.5rem;
        object-fit: contain;
        pointer-events: none;
      }

      #boot-splash[data-slow-load] .slow-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.02em;
        color: #24292f;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] .slow-title {
        color: oklch(0.95 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-body {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #656d76;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] .slow-body {
        color: oklch(0.72 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem 0.75rem;
        margin-top: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.4;
        color: #656d76;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] .slow-links {
        color: oklch(0.72 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-link {
        color: inherit;
        text-decoration: none;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        cursor: pointer;
      }

      #boot-splash[data-slow-load] .slow-link:hover,
      #boot-splash[data-slow-load] .slow-link:focus-visible {
        text-decoration: underline;
        outline: none;
      }

      #boot-splash[data-slow-load] .slow-sep {
        color: #8c959f;
        user-select: none;
      }

      #boot-splash[data-slow-load] .slow-brand {
        display: block;
        width: 2rem;
        height: 2rem;
        margin-top: 2rem;
        object-fit: contain;
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        data-boot-loader=""
        role="status"
        aria-live="polite"
        aria-label="Loading app"
      >
        <img class="dancer" src="/loader.gif" alt="" />
        <p class="caption" id="boot-splash-caption" aria-hidden="true"></p>
      </div>
    </div>
    <script>
      (function () {
        var phrases = [
          { lead: "Stretching it ", keyword: "out…" },
          { lead: "Finding the ", keyword: "groove…" },
          { lead: "Spotting the ", keyword: "turn…" },
          { lead: "Marking the ", keyword: "combo…" },
          { lead: "Feeling the ", keyword: "rhythm…" },
          { lead: "Stepping into ", keyword: "it…" },
        ];
        var CYCLE_MS = 2200;
        var STAGGER = 0.025;
        var el = document.getElementById("boot-splash-caption");
        if (!el) return;
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var last = -1;
        var cascade = document.createElement("span");
        cascade.className = "cascade";
        var measure = document.createElement("span");
        measure.className = "measure";
        measure.setAttribute("aria-hidden", "true");
        cascade.appendChild(measure);
        el.appendChild(cascade);

        function letterNodes(phrase) {
          var text = phrase.lead + phrase.keyword;
          var splitAt = phrase.lead.length;
          var nodes = [];
          for (var k = 0; k < text.length; k++) {
            var ch = text.charAt(k);
            var span = document.createElement("span");
            if (/\s/.test(ch)) {
              span.className = "letter space";
              span.textContent = "\u00A0";
            } else {
              span.className =
                k >= splitAt ? "letter brand" : "letter";
              span.textContent = ch;
            }
            span.style.animationDelay = k * STAGGER + "s";
            nodes.push(span);
          }
          return nodes;
        }

        function paint(phrase, animate) {
          var text = phrase.lead + phrase.keyword;
          measure.textContent = text;
          var incoming = document.createElement("span");
          incoming.className = "cascade-layer";
          incoming.setAttribute(
            "data-state",
            animate && !reduce ? "enter" : "idle",
          );
          var letters = letterNodes(phrase);
          for (var i = 0; i < letters.length; i++) {
            incoming.appendChild(letters[i]);
          }

          var outgoing = cascade.querySelector(".cascade-layer");
          if (outgoing && animate && !reduce) {
            outgoing.setAttribute("data-state", "exit");
            var exitMs = 180 + text.length * STAGGER * 500;
            window.setTimeout(function () {
              if (outgoing.parentNode) outgoing.parentNode.removeChild(outgoing);
            }, exitMs);
          } else if (outgoing) {
            outgoing.parentNode.removeChild(outgoing);
          }
          cascade.appendChild(incoming);
        }

        function tick() {
          var i = Math.floor(Date.now() / CYCLE_MS) % phrases.length;
          if (i === last) return;
          var animate = last !== -1;
          last = i;
          paint(phrases[i], animate);
        }
        tick();
        var phraseTimer = setInterval(tick, 100);

        var SLOW_LOAD_MS = 8000;
        window.setTimeout(function () {
          var splash = document.getElementById("boot-splash");
          if (!splash || !splash.isConnected) return;
          window.clearInterval(phraseTimer);
          splash.setAttribute("data-slow-load", "");
          splash.setAttribute(
            "aria-label",
            "This page is taking too long to load",
          );
          splash.innerHTML =
            '<div class="slow-content">' +
            '<img class="slow-mascot" src="/icons/unicorn.png" alt="" aria-hidden="true" />' +
            '<h1 class="slow-title">This page is taking too long to load.</h1>' +
            '<p class="slow-body">Sorry about that. Please try refreshing and contact us if the problem persists.</p>' +
            '<nav class="slow-links" aria-label="Helpful links">' +
            '<button type="button" class="slow-link" id="boot-slow-refresh">Refresh</button>' +
            '<span class="slow-sep" aria-hidden="true">—</span>' +
            '<a class="slow-link" href="/login">Sign in</a>' +
            '<span class="slow-sep" aria-hidden="true">—</span>' +
            '<a class="slow-link" href="/">Home</a>' +
            "</nav>" +
            '<img class="slow-brand" src="/icons/unicorn.png" alt="Step Up" />' +
            "</div>";
          var refresh = document.getElementById("boot-slow-refresh");
          if (refresh) {
            refresh.addEventListener("click", function () {
              window.location.reload();
            });
          }
        }, SLOW_LOAD_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
