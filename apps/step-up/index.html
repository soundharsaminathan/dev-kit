<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EE8A55" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#EE8A55"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="classa" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="classa is the workspace for dance studio owners. Collect fees, mark attendance, and run batches in one place, without chasing parents on WhatsApp."
    />
    <meta property="og:title" content="classa | Collect every fee without chasing parents" />
    <meta
      property="og:description"
      content="Students, batches, attendance, and payments in one workspace so you can teach instead of chase."
    />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/icons/dance.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>classa | Collect every fee without chasing parents</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dev-ui-theme-mode");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme-mode", mode);
          document.documentElement.setAttribute("data-theme", "step-up-soft");
          try {
            localStorage.setItem("dev-ui-theme", "step-up-soft");
          } catch (storageError) {}
        } catch (e) {}
      })();
    </script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/plus-jakarta-sans-latin-500.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("/fonts/plus-jakarta-sans-latin-600.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: "Plus Jakarta Sans";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/plus-jakarta-sans-latin-700.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5efe6;
      }

      html[data-theme-mode="light"] {
        color-scheme: light;
      }

      html[data-theme-mode="dark"] {
        color-scheme: dark;
        background: oklch(0.13 0.005 78);
      }

      html[data-theme-mode="dark"] body {
        background: oklch(0.13 0.005 78);
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #f5efe6;
        color: #1b2a4a;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }

      html[data-theme-mode="dark"] #boot-splash {
        background: oklch(0.13 0.005 78);
        color: oklch(0.95 0.01 78);
      }

      #boot-splash .dancer {
        display: none;
      }

      #boot-splash .mark {
        position: relative;
        width: min(42vw, 11rem);
        height: min(42vw, 11rem);
        margin: 0 auto 4.5rem;
      }

      #boot-splash .mark-pulse,
      #boot-splash .mark-core {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      #boot-splash .mark-pulse {
        border: 2px solid color-mix(in srgb, #ee8a55 55%, transparent);
        animation: boot-pulse 1.6s ease-out infinite;
      }

      #boot-splash .mark-core {
        inset: 22%;
        background: radial-gradient(
          circle at 35% 30%,
          color-mix(in srgb, #ee8a55 88%, #fff) 0%,
          #ee8a55 45%,
          color-mix(in srgb, #ee8a55 70%, #1b2a4a) 100%
        );
        box-shadow: 0 12px 40px color-mix(in srgb, #ee8a55 35%, transparent);
      }

      @keyframes boot-pulse {
        0% {
          transform: scale(0.72);
          opacity: 0.85;
        }
        70% {
          transform: scale(1.08);
          opacity: 0;
        }
        100% {
          transform: scale(1.08);
          opacity: 0;
        }
      }

      #boot-splash .caption {
        position: absolute;
        top: 75%;
        left: 0;
        right: 0;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 0 1.5rem;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(1.25rem, 4.5vw, 1.75rem);
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.03em;
        color: #1c1a17;
        text-align: center;
        transform: translateY(-50%);
      }

      /* Match /me banner title weight/size so late H1 paint does not steal LCP. */
      #boot-splash .caption[data-me-greeting] {
        font-weight: 800;
        max-width: 22rem;
        margin-inline: auto;
      }

      html[data-theme-mode="dark"] #boot-splash .caption {
        color: oklch(0.95 0.01 78);
      }

      #boot-splash .cascade {
        position: relative;
        display: block;
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        line-height: 1.3;
      }

      #boot-splash .measure {
        display: block;
        visibility: hidden;
        white-space: nowrap;
      }

      #boot-splash .cascade-layer {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        justify-content: center;
        width: 100%;
        height: 100%;
        white-space: pre;
      }

      #boot-splash .letter {
        display: inline-block;
        white-space: pre;
      }

      #boot-splash .letter.brand {
        color: #ee8a55;
      }

      #boot-splash .letter.space {
        width: 0.28em;
        flex-shrink: 0;
      }

      #boot-splash .cascade-layer[data-state="enter"] .letter {
        animation: boot-letter-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #boot-splash .cascade-layer[data-state="exit"] .letter {
        animation: boot-letter-out 0.18s ease both;
      }

      @keyframes boot-letter-in {
        from {
          opacity: 0;
          transform: translateY(105%);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      @keyframes boot-letter-out {
        from {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        to {
          opacity: 0;
          transform: translateY(-105%);
          filter: blur(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .mark-pulse {
          animation: none;
          opacity: 0.35;
        }

        #boot-splash .cascade-layer[data-state="enter"] .letter,
        #boot-splash .cascade-layer[data-state="exit"] .letter {
          animation: none;
        }
      }

      #boot-splash[data-slow-load] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 2rem 1rem;
        background: #f6f8fa;
        color: #24292f;
        text-align: center;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] {
        background: oklch(0.16 0.004 78);
        color: oklch(0.93 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        width: 100%;
        max-width: 28rem;
      }

      #boot-splash[data-slow-load] .slow-mascot {
        display: block;
        width: 10rem;
        height: 10rem;
        margin-bottom: 0.5rem;
        object-fit: contain;
        pointer-events: none;
      }

      #boot-splash[data-slow-load] .slow-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: -0.02em;
        color: #24292f;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] .slow-title {
        color: oklch(0.95 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-body {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #656d76;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] .slow-body {
        color: oklch(0.72 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem 0.75rem;
        margin-top: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.4;
        color: #656d76;
      }

      html[data-theme-mode="dark"] #boot-splash[data-slow-load] .slow-links {
        color: oklch(0.72 0.01 78);
      }

      #boot-splash[data-slow-load] .slow-link {
        color: inherit;
        text-decoration: none;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        cursor: pointer;
      }

      #boot-splash[data-slow-load] .slow-link:hover,
      #boot-splash[data-slow-load] .slow-link:focus-visible {
        text-decoration: underline;
        outline: none;
      }

      #boot-splash[data-slow-load] .slow-sep {
        color: #8c959f;
        user-select: none;
      }

      #boot-splash[data-slow-load] .slow-brand {
        display: block;
        width: 2rem;
        height: 2rem;
        margin-top: 2rem;
        object-fit: contain;
        opacity: 0.55;
        pointer-events: none;
      }

      /* Static public shells — paint LCP text before JS. */
      #boot-public {
        position: fixed;
        inset: 0;
        z-index: 70;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        background: #f5efe6;
        color: #1c1a17;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }

      html[data-theme-mode="dark"] #boot-public {
        background: oklch(0.13 0.005 78);
        color: oklch(0.95 0.01 78);
      }

      #boot-public .shell-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 3.5rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid rgb(28 26 23 / 8%);
      }

      #boot-public .shell-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-decoration: none;
        color: inherit;
      }

      #boot-public .shell-brand img {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.5rem;
        object-fit: contain;
      }

      #boot-public .shell-main {
        flex: 1;
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        padding: 2rem 1rem 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.5rem;
        box-sizing: border-box;
      }

      #boot-public .shell-main.shell-main-landing {
        max-width: 42.5rem;
        text-align: left;
        align-items: flex-start;
        padding-top: 2.5rem;
        gap: 1rem;
      }

      #boot-public .hero-eyebrow {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ee8a55;
      }

      #boot-public .hero-brand {
        margin: 0;
        max-width: 42.5rem;
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #1c1a17;
      }

      html[data-theme-mode="dark"] #boot-public .hero-brand {
        color: oklch(0.95 0.01 78);
      }

      @media (min-width: 768px) {
        #boot-public .hero-brand {
          font-size: 3rem;
        }
      }

      @media (min-width: 1100px) {
        #boot-public .hero-brand {
          font-size: 3.75rem;
        }
      }

      #boot-public .hero-headline {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.35;
        color: rgb(28 26 23 / 88%);
      }

      html[data-theme-mode="dark"] #boot-public .hero-headline {
        color: oklch(0.88 0.01 78);
      }

      #boot-public .hero-support {
        margin: 0;
        max-width: 34rem;
        font-size: 1rem;
        line-height: 1.55;
        color: rgb(28 26 23 / 62%);
      }

      html[data-theme-mode="dark"] #boot-public .hero-support {
        color: oklch(0.72 0.01 78);
      }

      #boot-public .login-title {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: inherit;
      }

      #boot-public .login-subtitle {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.45;
        color: rgb(28 26 23 / 62%);
      }

      html[data-theme-mode="dark"] #boot-public .login-subtitle {
        color: oklch(0.72 0.01 78);
      }

      #boot-public .shell-footer {
        padding: 1.5rem 1rem;
        text-align: center;
        color: rgb(28 26 23 / 56%);
        font-size: 0.875rem;
      }

      html[data-theme-mode="dark"] #boot-public .shell-footer {
        color: oklch(0.72 0.01 78);
      }

      html[data-boot-public] #root {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        data-boot-loader=""
        role="status"
        aria-live="polite"
        aria-label="Loading app"
      >
        <div class="mark" aria-hidden="true">
          <span class="mark-pulse"></span>
          <span class="mark-core"></span>
        </div>
        <p class="caption" id="boot-splash-caption" aria-hidden="true"></p>
      </div>
    </div>
    <script>
      (function () {
        var path = location.pathname || "/";
        var root = document.getElementById("root");
        if (!root) return;

        function publicShell(inner, mainClass) {
          return (
            '<div id="boot-public">' +
            '<header class="shell-header">' +
            '<a class="shell-brand" href="/">' +
            '<img src="/icons/dance.svg" alt="" />' +
            "<span>classa</span>" +
            "</a>" +
            "</header>" +
            '<main class="shell-main' +
            (mainClass ? " " + mainClass : "") +
            '">' +
            inner +
            "</main>" +
            '<footer class="shell-footer">classa Dance Studio — move with confidence.</footer>' +
            "</div>"
          );
        }

        function mountPublic(inner, mainClass) {
          // Keep the shell outside #root so React createRoot does not destroy
          // the early LCP element when the app mounts.
          var shellHtml = publicShell(inner, mainClass);
          var wrap = document.createElement("div");
          wrap.innerHTML = shellHtml;
          var shell = wrap.firstChild;
          document.body.insertBefore(shell, root);
          root.innerHTML = "";
        }

        // Public routes: paint real LCP text in HTML before the module graph.
        if (path === "/" || path === "") {
          mountPublic(
            '<h1 class="hero-brand">Collect every fee<br />without chasing parents</h1>' +
              '<p class="hero-support">classa is the workspace for dance studio owners. Students, batches, attendance, and payments live in one place so you can teach instead of chase.</p>',
            "shell-main-landing",
          );
          return;
        }

        if (path === "/login" || path.indexOf("/login") === 0) {
          mountPublic(
            '<p class="login-eyebrow" style="margin:0;font-size:0.875rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#ee8a55">classa</p>' +
              '<h1 class="login-title">Welcome back</h1>' +
              '<p class="login-subtitle">Sign in to manage your studio or continue to your classes.</p>',
          );
          return;
        }

        if (
          path.indexOf("/register") === 0 ||
          path.indexOf("/forgot-password") === 0 ||
          path.indexOf("/join") === 0 ||
          path.indexOf("/studio/") === 0
        ) {
          mountPublic(
            '<h1 class="login-title">classa</h1>' +
              '<p class="login-subtitle">Loading…</p>',
          );
          return;
        }

        var phrases = [
          { lead: "Stretching it ", keyword: "out…" },
          { lead: "Finding the ", keyword: "groove…" },
          { lead: "Spotting the ", keyword: "turn…" },
          { lead: "Marking the ", keyword: "combo…" },
          { lead: "Feeling the ", keyword: "rhythm…" },
          { lead: "Stepping into ", keyword: "it…" },
        ];
        var el = document.getElementById("boot-splash-caption");
        if (!el) return;
        // Static full caption (no per-letter cascade): cascading letters made
        // LCP a single glyph first, then the full phrase ~1s later under mobile
        // throttle. Paint the complete line immediately for a stable early LCP.
        //
        // /me: paint the session greeting at banner weight so LCP lands here
        // instead of waiting for Firebase → shell → banner H1 (~8s throttle).
        // This is display-only — protected UI still waits on Firebase auth.
        var meGreeting = null;
        if (path.indexOf("/me") === 0) {
          try {
            var cached = JSON.parse(
              localStorage.getItem("step-up-session-user") || "null",
            );
            var firstName =
              cached &&
              cached.user &&
              typeof cached.user.name === "string" &&
              cached.user.name.split(" ")[0];
            if (firstName) {
              meGreeting = "Hey, " + firstName + " — let's dance";
            }
          } catch (e) {
            meGreeting = null;
          }
        }
        if (meGreeting) {
          el.textContent = meGreeting;
          el.setAttribute("data-me-greeting", "");
        } else {
          var first = phrases[1];
          el.textContent = first.lead + first.keyword;
        }

        var SLOW_LOAD_MS = 8000;
        window.setTimeout(function () {
          var splash = document.getElementById("boot-splash");
          if (!splash || !splash.isConnected) return;
          splash.setAttribute("data-slow-load", "");
          splash.setAttribute(
            "aria-label",
            "This page is taking too long to load",
          );
          splash.innerHTML =
            '<div class="slow-content">' +
            '<img class="slow-mascot" src="/icons/dance.svg" alt="" aria-hidden="true" />' +
            '<h1 class="slow-title">This page is taking too long to load.</h1>' +
            '<p class="slow-body">Sorry about that. Please try refreshing and contact us if the problem persists.</p>' +
            '<nav class="slow-links" aria-label="Helpful links">' +
            '<button type="button" class="slow-link" id="boot-slow-refresh">Refresh</button>' +
            '<span class="slow-sep" aria-hidden="true">—</span>' +
            '<a class="slow-link" href="/login">Sign in</a>' +
            '<span class="slow-sep" aria-hidden="true">—</span>' +
            '<a class="slow-link" href="/">Home</a>' +
            "</nav>" +
            '<img class="slow-brand" src="/icons/dance.svg" alt="classa" />' +
            "</div>";
          var refresh = document.getElementById("boot-slow-refresh");
          if (refresh) {
            refresh.addEventListener("click", function () {
              window.location.reload();
            });
          }
        }, SLOW_LOAD_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
