name: CI

on:
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Generate design tokens
        run: pnpm build:tokens

      - name: Install Playwright browser
        run: pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps

      - name: Run tests
        run: pnpm test:ci

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() && !cancelled()
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Publish coverage summary
        uses: ArtiomTr/jest-coverage-report-action@v2
        if: github.event_name == 'pull_request' && always() && !cancelled()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: coverage/coverage-summary.json
          package-name: dev-kit

  visual:
    name: Playwright visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Generate design tokens
        run: pnpm build:tokens

      - name: Install Playwright browser
        run: pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps

      - name: Run Playwright tests (full suite on merge queue)
        if: github.event_name == 'merge_group'
        run: pnpm test:e2e
        env:
          CI: true

      - name: Run affected Playwright tests
        if: github.event_name != 'merge_group'
        run: pnpm affected:e2e --base=origin/${{ github.base_ref }}
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/storybook/playwright-report/
          retention-days: 7

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: apps/storybook/test-results/
          retention-days: 7
