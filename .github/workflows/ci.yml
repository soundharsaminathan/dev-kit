name: CI

on:
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Generate design tokens
        run: pnpm build:tokens

      - name: Install Playwright browser
        run: pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps

      - name: Run tests
        run: pnpm test:ci

      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: always() && !cancelled()
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit
