name: CI

on:
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps

      - name: Run affected Vitest (PR)
        if: github.event_name != 'merge_group'
        run: |
          pnpm exec nx affected -t test:ci --base=origin/${{ github.base_ref }}
          pnpm exec nx run dev-kit:merge-coverage
        env:
          CI: true

      - name: Run full Vitest suite (merge queue)
        if: github.event_name == 'merge_group'
        run: pnpm exec nx run dev-kit:test:ci
        env:
          CI: true

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() && !cancelled()
        with:
          name: Vitest
          path: test-results/junit-*.xml
          reporter: java-junit

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Format coverage comment
        id: coverage
        if: github.event_name == 'pull_request' && always() && !cancelled()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            pnpm exec tsx scripts/format-coverage-comment.ts
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish coverage summary
        uses: marocchino/sticky-pull-request-comment@v3
        if: steps.coverage.outputs.available == 'true'
        with:
          header: coverage
          path: coverage-comment.md

  visual:
    name: Playwright visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps

      - name: Run Playwright tests (full suite on merge queue)
        if: github.event_name == 'merge_group'
        run: pnpm test:e2e
        env:
          CI: true

      - name: Run affected Playwright tests
        if: github.event_name != 'merge_group'
        run: pnpm affected:e2e --base=origin/${{ github.base_ref }}
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/storybook/playwright-report/
          retention-days: 7

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: apps/storybook/test-results/
          retention-days: 7
