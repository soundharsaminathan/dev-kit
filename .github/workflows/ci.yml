name: CI

on:
  pull_request:
    branches: ["**"]
  merge_group:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps

      - name: Run affected Vitest (PR)
        if: github.event_name != 'merge_group'
        run: |
          pnpm exec nx affected -t test:ci --base=origin/${{ github.base_ref }}
          pnpm exec nx run dev-kit:merge-coverage
        env:
          CI: true

      - name: Run full Vitest suite (merge queue)
        if: github.event_name == 'merge_group'
        run: pnpm exec nx run dev-kit:test:ci
        env:
          CI: true

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() && !cancelled()
        with:
          name: Vitest
          path: test-results/junit-*.xml
          reporter: java-junit

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Format coverage comment
        id: coverage
        if: github.event_name == 'pull_request' && always() && !cancelled()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            pnpm exec tsx scripts/format-coverage-comment.ts
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish coverage summary
        uses: marocchino/sticky-pull-request-comment@v3
        if: steps.coverage.outputs.available == 'true'
        with:
          header: coverage
          path: coverage-comment.md

  visual:
    name: Playwright visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: |
          pnpm --filter @dev-ui/storybook exec playwright install chromium --with-deps
          pnpm --filter @dev-ui/showcase exec playwright install chromium --with-deps

      - name: Run Playwright tests (full suite on merge queue)
        if: github.event_name == 'merge_group'
        run: |
          pnpm test:e2e
          pnpm test:showcase:e2e
        env:
          CI: true

      - name: Run affected Playwright tests
        if: github.event_name != 'merge_group'
        run: |
          pnpm affected:e2e --base=origin/${{ github.base_ref }}
          pnpm exec nx run showcase:test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/storybook/playwright-report/
            apps/showcase/playwright-report/
          retention-days: 7

      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: |
            apps/storybook/test-results/
            apps/showcase/test-results/
          retention-days: 7

  step-up-regression:
    name: Step Up regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: step_up_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_BYPASS: "true"
      VITE_AUTH_BYPASS: "true"
      VITE_API_URL: http://localhost:3199
      STEP_UP_API_URL: http://localhost:3199
      STEP_UP_WEB_URL: http://localhost:5199
      STEP_UP_API_PORT: "3199"
      STEP_UP_WEB_PORT: "5199"
      PORT: "3199"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/step_up_e2e?schema=public
      SESSION_QR_SECRET: ci-session-qr-secret-0123456789abcdef
      JOBS_SECRET: ci-jobs-secret-0123456789abcdef0123456789
      CHAT_MASTER_KEY: 
      PII_MASTER_KEY: 
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Detect Step Up changes
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(apps/step-up|apps/step-up-api)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create migrate smoke database
        if: steps.changes.outputs.run == 'true'
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE step_up_migrate;"

      - name: Migration smoke
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/step-up-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/step_up_migrate?schema=public
        run: |
          pnpm exec prisma generate
          pnpm exec nx run step-up-api:test:migrations

      - name: Generate Prisma client, migrate, and seed
        if: steps.changes.outputs.run == 'true'
        working-directory: apps/step-up-api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Vitest API + UI
        if: steps.changes.outputs.run == 'true'
        run: |
          pnpm exec nx run step-up-api:test
          pnpm exec nx run step-up:test
        env:
          CI: true

      - name: Install Playwright browser
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @step-up/web exec playwright install chromium --with-deps

      - name: Critical Playwright journeys
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec nx run step-up:test:e2e:critical
        env:
          CI: true

      - name: Upload Step Up regression report
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.run == 'true' && !cancelled()
        with:
          name: step-up-regression-report
          path: |
            apps/step-up/playwright-report/
            apps/step-up/test-results/
          retention-days: 7

  step-up-e2e:
    name: Step Up E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'merge_group'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: step_up_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_BYPASS: "true"
      VITE_AUTH_BYPASS: "true"
      VITE_API_URL: http://localhost:3199
      STEP_UP_API_URL: http://localhost:3199
      STEP_UP_WEB_URL: http://localhost:5199
      STEP_UP_API_PORT: "3199"
      STEP_UP_WEB_PORT: "5199"
      PORT: "3199"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/step_up_e2e?schema=public
      SESSION_QR_SECRET: ci-session-qr-secret-0123456789abcdef
      JOBS_SECRET: ci-jobs-secret-0123456789abcdef0123456789
      CHAT_MASTER_KEY: 
      PII_MASTER_KEY: 
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Create migrate smoke database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE step_up_migrate;"

      - name: Migration smoke
        working-directory: apps/step-up-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/step_up_migrate?schema=public
        run: |
          pnpm exec prisma generate
          pnpm exec nx run step-up-api:test:migrations

      - name: Generate Prisma client, migrate, and seed
        working-directory: apps/step-up-api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Install Playwright browser
        run: pnpm --filter @step-up/web exec playwright install chromium --with-deps

      - name: Run Step Up Playwright E2E
        run: pnpm exec nx run step-up:test:e2e
        env:
          CI: true

      - name: Upload Step Up Playwright report
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: step-up-playwright-report
          path: |
            apps/step-up/playwright-report/
            apps/step-up/test-results/
          retention-days: 7
