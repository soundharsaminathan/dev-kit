packages:
  - "packages/*"
  - "apps/*"
  - "scripts"

catalog:
  react: ^19.2.0
  react-dom: ^19.2.0
  vite: ^8.0.16

# pnpm 11: replaces package.json "pnpm.onlyBuiltDependencies"
allowBuilds:
  "@biomejs/biome": true
  "@firebase/util": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  core-js: false
  esbuild: true
  msgpackr-extract: true
  msw: true
  nx: true
  prisma: true
  protobufjs: true

# pnpm 11 defaults to 1440 (1 day); restore pre-v11 behavior for dev tooling
minimumReleaseAge: 0

overrides:
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@vitest/browser@>=4.0.0 <4.1.10': ^4.1.10
  axios@>=1.0.0 <1.18.0: ^1.18.0
  brace-expansion@>=3.0.0 <5.0.7: ^5.0.7
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  tmp@>=0.2.6 <0.2.7: ^0.2.7
  uuid@<11.1.1: ^11.1.1
